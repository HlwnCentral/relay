name: Refresh Paopaogou Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch latest subscription
        env:
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SUBSCRIPTION_URL:-}" ]; then
            echo "SUBSCRIPTION_URL secret is not configured."
            exit 1
          fi

          mkdir -p relay

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            --user-agent "sing-box/1.13.0" \
            --header "Accept: */*" \
            "$SUBSCRIPTION_URL" \
            --output relay/subscription.txt.tmp

          if [ ! -s relay/subscription.txt.tmp ]; then
            echo "Downloaded subscription is empty."
            exit 1
          fi

          mv relay/subscription.txt.tmp relay/subscription.txt

          echo "=== relay directory ==="
          ls -lah relay
          echo "=== file size ==="
          wc -c relay/subscription.txt
          echo "=== first 120 bytes ==="
          head -c 120 relay/subscription.txt || true
          echo

      - name: Commit to default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          echo "Default branch: $DEFAULT_BRANCH"
          echo "Current branch: $(git branch --show-current)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Force-add in case a repository-level ignore rule hides *.txt.
          git add -f relay/subscription.txt

          echo "=== staged status ==="
          git status --short
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "No staged content change."
            echo "Checking whether subscription.txt is already tracked:"
            git ls-files relay/subscription.txt || true

            if git ls-files --error-unmatch relay/subscription.txt >/dev/null 2>&1; then
              echo "relay/subscription.txt is already tracked and unchanged."
              exit 0
            fi

            echo "ERROR: subscription.txt exists locally but is not staged/tracked."
            exit 1
          fi

          git commit -m "Update subscription"

          # Push explicitly to the repository's default branch.
          git push origin "HEAD:${DEFAULT_BRANCH}"

          echo "=== committed file ==="
          git ls-tree --name-only HEAD relay/
          git log -1 --oneline
